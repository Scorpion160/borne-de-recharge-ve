services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: vescope_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro

  postgres:
    image: postgres:17-alpine
    container_name: vescope_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vescope
      POSTGRES_USER: vescope
      POSTGRES_PASSWORD: ${VESCOPE_DB_PASSWORD:-vescope}
    volumes:
      - vescope_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vescope -d vescope"]
      interval: 5s
      timeout: 3s
      retries: 10

  hub:
    build:
      context: ../backend/vescope-hub
    container_name: vescope_hub
    restart: unless-stopped
    depends_on:
      mqtt:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      VESCOPE_MQTT_HOST: mqtt
      VESCOPE_MQTT_PORT: "1883"
      VESCOPE_MQTT_TOPIC_PREFIX: vescope
      VESCOPE_DATABASE_URL: postgresql://vescope:${VESCOPE_DB_PASSWORD:-vescope}@postgres:5432/vescope

  supervisor:
    build:
      context: ../frontend/vescope-supervisor
      dockerfile: Dockerfile.prod
    container_name: vescope_supervisor
    restart: unless-stopped
    depends_on:
      - hub
    ports:
      - "${VESCOPE_HTTP_PORT:-8080}:80"

volumes:
  vescope_postgres_data:
