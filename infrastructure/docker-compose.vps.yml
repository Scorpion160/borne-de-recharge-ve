services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: vescope_mqtt
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.vps.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/secrets:/mosquitto/secrets:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - vescope_mqtt_data:/mosquitto/data
    ports:
      - "8883:8883"

  postgres:
    image: postgres:17-alpine
    container_name: vescope_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vescope
      POSTGRES_USER: vescope
      POSTGRES_PASSWORD: ${VESCOPE_DB_PASSWORD}
    volumes:
      - vescope_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vescope -d vescope"]
      interval: 5s
      timeout: 3s
      retries: 15

  hub:
    build:
      context: ../backend/vescope-hub
    container_name: vescope_hub
    restart: unless-stopped
    depends_on:
      mqtt:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      VESCOPE_MQTT_HOST: mqtt
      VESCOPE_MQTT_PORT: "1883"
      VESCOPE_MQTT_TOPIC_PREFIX: vescope
      VESCOPE_DATABASE_URL: postgresql://vescope:${VESCOPE_DB_PASSWORD}@postgres:5432/vescope

  supervisor:
    build:
      context: ../frontend/vescope-supervisor
      dockerfile: Dockerfile.prod
    container_name: vescope_supervisor
    restart: unless-stopped
    depends_on:
      - hub
    ports:
      - "127.0.0.1:${VESCOPE_HTTP_PORT:-8010}:80"

  simulator:
    profiles: ["simulation"]
    build:
      context: ../simulator/vescope-core
    container_name: vescope_simulator
    restart: unless-stopped
    depends_on:
      - mqtt
    command: ["python", "simulator.py", "--broker", "mqtt", "--port", "1883", "--device-id", "borne-01"]

volumes:
  vescope_postgres_data:
  vescope_mqtt_data:
