server {
    listen 80;
    listen [::]:80;
    server_name mqtt.vescope.kerunjombor.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mqtt.vescope.kerunjombor.net;

    ssl_certificate /etc/letsencrypt/live/mqtt.vescope.kerunjombor.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mqtt.vescope.kerunjombor.net/privkey.pem;

    client_max_body_size 64k;

    location ^~ /api/v1/ingest/ {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8011/health;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
