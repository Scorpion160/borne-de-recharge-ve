server {
    listen 80;
    listen [::]:80;
    server_name vescope.kerunjombor.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vescope.kerunjombor.net;

    ssl_certificate /etc/letsencrypt/live/vescope.kerunjombor.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vescope.kerunjombor.net/privkey.pem;

    auth_basic "VE-SCOPE";
    auth_basic_user_file /etc/nginx/vescope.htpasswd;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
}
