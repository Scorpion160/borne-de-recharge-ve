services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: vescope_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro

  postgres:
    image: postgres:17-alpine
    container_name: vescope_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vescope
      POSTGRES_USER: vescope
      POSTGRES_PASSWORD: vescope
    ports:
      - "5434:5432"
    volumes:
      - vescope_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vescope -d vescope"]
      interval: 3s
      timeout: 3s
      retries: 10

  hub:
    build:
      context: ../backend/vescope-hub
    container_name: vescope_hub
    restart: unless-stopped
    depends_on:
      mqtt:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      VESCOPE_MQTT_HOST: mqtt
      VESCOPE_MQTT_PORT: "1883"
      VESCOPE_MQTT_TOPIC_PREFIX: vescope
      VESCOPE_DATABASE_URL: postgresql://vescope:vescope@postgres:5432/vescope
      VESCOPE_LOW_VOLTAGE_V: "207"
      VESCOPE_HIGH_VOLTAGE_V: "253"
      VESCOPE_LOW_POWER_FACTOR: "0.90"
      VESCOPE_LOW_FREQUENCY_HZ: "49.0"
      VESCOPE_HIGH_FREQUENCY_HZ: "51.0"
      VESCOPE_STALE_AFTER_S: "5"
    ports:
      - "8003:8000"

volumes:
  vescope_postgres_data:
