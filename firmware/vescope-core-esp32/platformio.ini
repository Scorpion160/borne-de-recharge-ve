[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.0.0
  adafruit/Adafruit GFX Library @ ^1.11.11
  adafruit/Adafruit SSD1306 @ ^2.5.11
  h2zero/NimBLE-Arduino @ ^2.3.5

[env:esp32dev]
board = esp32dev
build_src_filter =
  +<*>
  -<board_test.cpp>
build_flags =
  -D CORE_DEBUG_LEVEL=1
  -D VESCOPE_BOARD_CLASSIC=1

[env:esp32dev-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = vescope-borne-01.local
upload_flags =
  --auth=${sysenv.VESCOPE_OTA_PASSWORD}

[env:esp32dev-board-test]
board = esp32dev
build_src_filter =
  -<*>
  +<board_test.cpp>
  +<pzem_modbus.cpp>
build_flags =
  -D CORE_DEBUG_LEVEL=1
  -D VESCOPE_BOARD_CLASSIC=1
  -D VESCOPE_BOARD_TEST=1

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_src_filter =
  +<*>
  -<board_test.cpp>
build_flags =
  -D CORE_DEBUG_LEVEL=1
  -D VESCOPE_BOARD_S3=1
