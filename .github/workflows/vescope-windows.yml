name: VE-SCOPE Windows

on:
  push:
    branches: [agent/vescope-android-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Build executable and ZIP
        shell: pwsh
        run: .\scripts\build-vescope-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: VE-SCOPE-Windows
          path: frontend/vescope_flutter/build/VE-SCOPE-Windows.zip
          if-no-files-found: error
          retention-days: 14
