name: ESP32 firmware OTA build

on:
  push:
    paths:
      - 'firmware/vescope-core-esp32/**'
      - '.github/workflows/firmware-ota-build.yml'
  pull_request:
    paths:
      - 'firmware/vescope-core-esp32/**'
      - '.github/workflows/firmware-ota-build.yml'

jobs:
  esp32dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile classic ESP32 OTA firmware
        run: pio run -d firmware/vescope-core-esp32 -e esp32dev
